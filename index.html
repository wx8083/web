<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>直播间</title>
<meta name="description" content="进入直播间，观看精彩直播">
<meta property="og:type" content="website">
<meta property="og:title" content="直播间">
<meta property="og:description" content="进入直播间，观看精彩直播">
<meta property="og:image" content="https://wx8083.github.io/web/share-logo.png">
<meta property="og:image:secure_url" content="https://wx8083.github.io/web/share-logo.png">
<meta property="og:image:type" content="image/png">
<meta property="og:url" content="https://wx8083.github.io/web/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="直播间">
<meta name="twitter:image" content="https://wx8083.github.io/web/share-logo.png">
<link rel="image_src" href="https://wx8083.github.io/web/share-logo.png">
<style>
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;height:100%;margin:0;overflow:hidden;background:#000}
#liveFrame{display:block;width:100%;height:100%;border:0;background:#000}
.error{display:none;box-sizing:border-box;min-height:100%;padding:22vh 28px;color:#fff;text-align:center;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}
</style>
<script>
/* Yunbo shell typography guard 20261007b: bounded retries, no polling. */
(function () {
  'use strict';
  if (!/MicroMessenger/i.test(navigator.userAgent) || !/Android/i.test(navigator.userAgent)) return;
  var boundBridge = null, active = false, timers = [], lastReset = 0;
  function reset() {
    if (document.hidden) return;
    var bridge = window.WeixinJSBridge;
    if (!bridge || typeof bridge.invoke !== 'function') return;
    if (boundBridge !== bridge && typeof bridge.on === 'function') {
      boundBridge = bridge;
      bridge.on('menu:setfont', schedule);
    }
    if (Date.now() - lastReset < 250) return;
    lastReset = Date.now();
    try { bridge.invoke('setFontSizeCallback', { fontSize: 0 }, function () {}); } catch (error) {}
  }
  function clear() {
    timers.forEach(function (timer) { clearTimeout(timer); });
    timers = []; active = false;
  }
  function schedule() {
    if (document.hidden || active) return;
    active = true;
    reset();
    [300, 1000, 2500, 5000].forEach(function (delay) { timers.push(setTimeout(reset, delay)); });
    timers.push(setTimeout(function () { active = false; timers = []; }, 5300));
  }
  function bindFrame() {
    var frame = document.getElementById('liveFrame');
    if (frame) frame.addEventListener('load', schedule, false);
    schedule();
  }
  document.addEventListener('WeixinJSBridgeReady', schedule, false);
  document.addEventListener('DOMContentLoaded', bindFrame, false);
  document.addEventListener('visibilitychange', function () { if (document.hidden) clear(); else schedule(); }, false);
  window.addEventListener('pageshow', schedule, false);
  window.addEventListener('pagehide', clear, false);
  window.addEventListener('focus', schedule, false);
  window.addEventListener('orientationchange', schedule, false);
  if (document.readyState !== 'loading') bindFrame();
  schedule();
}());
</script>
</head>
<body>
<iframe id="liveFrame" title="直播间" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="error" class="error">直播间地址不正确</div>
<script>
(function () {
  var match = location.pathname.match(/^\/web\/(?:live\/)?(\d+)(?:\/([au]_(?:[a-z0-9]{6}|[a-f0-9]{32})))?\/?$/);
  var params = new URLSearchParams(location.search);
  var roomId = match ? match[1] : (params.get('room_id') || params.get('id') || '');
  var frame = document.getElementById('liveFrame');
  if (params.has('proof_upload')) {
    var proofToken = location.hash.slice(1);
    if (!['payment','product'].includes(params.get('proof_upload')) || !/^[a-f0-9]{64}$/.test(proofToken)) {
      frame.remove();
      document.getElementById('error').textContent = '上传链接无效，请重新扫描电脑端二维码';
      document.getElementById('error').style.display = 'block';
      return;
    }
    document.title = frame.title = params.get('proof_upload') === 'product' ? '上传商品图' : '上传付款凭证';
    frame.src = 'https://zhibo.stmpsk.cn/manual-proof-mobile.php?purpose=' + params.get('proof_upload') + '#' + proofToken;
    return;
  }
  if (!/^\d+$/.test(roomId) || Number(roomId) < 1) {
    frame.remove();
    document.getElementById('error').style.display = 'block';
    return;
  }
  var shareCode=match&&match[2]||params.get('s')||'';
  var identity='';
  try{identity=localStorage.getItem('yunbo_share_identity_v1')||'';if(!shareCode&&(params.has('wx_ticket')||params.has('payment')||params.get('open')==='orders'))shareCode=localStorage.getItem('yunbo_share_entry_'+roomId)||'';}catch(e){}
  if(!/^[au]_(?:[a-z0-9]{6}|[a-f0-9]{32})$/.test(shareCode)){frame.remove();document.getElementById('error').textContent='请使用主播或用户分享的完整直播间链接进入';document.getElementById('error').style.display='block';return;}
  try{localStorage.setItem('yunbo_share_entry_'+roomId,shareCode);}catch(e){}
  var target = new URL('https://zhibo.stmpsk.cn/share-entry.php');
  target.searchParams.set('room_id',roomId);target.searchParams.set('share',shareCode);
  if(/^[a-f0-9]{64}$/.test(identity))target.searchParams.set('identity',identity);
  ['payment','order_no','open'].forEach(function(k){if(params.has(k))target.searchParams.set(k,params.get(k));});
  var ticket = params.get('wx_ticket');
  if (ticket) target.searchParams.set('wx_ticket', ticket);
  var shareUrl = 'https://live830.github.io/web/live/' + roomId+'/'+shareCode;
  document.querySelector('meta[property="og:url"]').content = shareUrl;
  function updateRoomTitle(title) {
    if (typeof title !== 'string' || !title.trim()) return;
    title = title.trim();
    document.title = title;
    frame.title = title;
    document.querySelector('meta[property="og:title"]').content = title;
    document.querySelector('meta[name="twitter:title"]').content = title;
  }
  window.addEventListener('message', function (event) {
    if (event.source !== frame.contentWindow || event.origin !== target.origin || !event.data) return;
    var data = event.data;
    if(data.source==='yunbo-share-identity'&&String(data.room_id)===String(roomId)&&/^[a-f0-9]{64}$/.test(data.identity||'')){try{localStorage.setItem('yunbo_share_identity_v1',data.identity);}catch(e){}return;}
    if(data.source==='yunbo-share-ready'&&String(data.room_id)===String(roomId)&&/^u_(?:[a-z0-9]{6}|[a-f0-9]{32})$/.test(data.code||'')){
      var ownUrl='https://live830.github.io/web/live/'+roomId+'/'+data.code;
      document.querySelector('meta[property="og:url"]').content=ownUrl;
      history.replaceState(null,'','/web/live/'+roomId+'/'+data.code);
      try{localStorage.setItem('yunbo_share_entry_'+roomId,data.code);}catch(e){}
      return;
    }
    if (data.source === 'yunbo-viewer-block' && String(data.room_id) === String(roomId)) {
      try {
        var destination = new URL(data.redirect_url);
        if (!/^https?:$/.test(destination.protocol) || destination.username || destination.password) return;
        location.replace(destination.href);
      } catch (error) {}
      return;
    }

    if(data.source==='yunbo-wechat-storage'&&String(data.room_id)===String(roomId)){
      var authKey='yunbo_auth_zhibo_v1';
      var tokenPattern=/^[A-Za-z0-9_-]{40,128}$/;
      var savedToken='';
      try{savedToken=localStorage.getItem(authKey)||'';}catch(error){}
      if(data.action==='get'){
        frame.contentWindow.postMessage({source:'yunbo-wechat-storage',action:'restored',request_id:data.request_id,token:tokenPattern.test(savedToken)?savedToken:''},target.origin);
      }else if(data.action==='set'&&typeof data.token==='string'&&tokenPattern.test(data.token)){
        try{localStorage.setItem(authKey,data.token);}catch(error){}
      }else if(data.action==='clear'&&savedToken===data.token){
        try{localStorage.removeItem(authKey);}catch(error){}
      }
      return;
    }
    if (data.source === 'yunbo-live-meta' && String(data.room_id) === String(roomId)) {
      updateRoomTitle(data.title);
    }
    if (data.source === 'yunbo-wechat-auth' && data.action === 'complete') {
      history.replaceState(null, '', '/web/live/' + roomId+'/'+shareCode);
    }
  });
  frame.addEventListener('load', function () {
    frame.contentWindow.postMessage({source: 'yunbo-live-shell', action: 'request-meta', room_id: roomId}, target.origin);
  });
  function sendChatViewport() {
    var vv=window.visualViewport;
    var rect=frame.getBoundingClientRect();
    var top=vv?vv.offsetTop:0;
    var bottom=top+(vv?vv.height:window.innerHeight);
    frame.contentWindow.postMessage({source:'yunbo-shell-viewport',room_id:roomId,top:Math.max(0,top-rect.top),bottom:Math.max(0,Math.min(rect.height,bottom-rect.top))},target.origin);
  }
  if(window.visualViewport){window.visualViewport.addEventListener('resize',sendChatViewport);window.visualViewport.addEventListener('scroll',sendChatViewport);}
  window.addEventListener('resize',sendChatViewport);
  frame.addEventListener('load',sendChatViewport);
  window.addEventListener('message',function(event){if(event.source===frame.contentWindow&&event.origin===target.origin&&event.data&&event.data.source==='yunbo-chat-viewport'&&event.data.action==='request')sendChatViewport();});
  frame.src = target.toString();
})();
</script>
</body>
</html>
